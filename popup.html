<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ultrawide Black Bars</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        padding: 14px;
        min-width: 220px;
        background: #111827;
        color: #f9fafb;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }

      legend {
        margin-bottom: 8px;
        font-weight: 600;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        cursor: pointer;
      }

      p {
        margin: 10px 0 0;
        color: #cbd5e1;
      }

      code {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Playback mode</legend>
      <label><input type="radio" name="mode" value="original"> Original aspect ratio</label>
      <label><input type="radio" name="mode" value="crop"> Crop to fill</label>
      <label><input type="radio" name="mode" value="ambient"> Ambient light</label>
    </fieldset>
    <p>Suggested shortcut: <code>Alt+Shift+U</code> / <code>Command+Shift+U</code> on macOS. You can set it on your browser's extension shortcuts page.</p>
    <script src="popup.js"></script>
  </body>
</html>
